# Runtime dir for the Unix sockets of the mrcall-desktop daemons. It lives
# on tmpfs (/run), so it must be recreated at every boot — that is what
# this tmpfiles.d entry does.
#
# Since plan M2 every profile daemon runs as its own user and binds
# /run/mrcalld/<uid>/ws.sock; `mrcall-tenant create` writes one fragment
# per uid (`d /run/mrcalld/<uid> 2750 <user> caddy`). This parent must be
# TRAVERSABLE by those users (other-execute) and stay SETGID `caddy`
# (2751): provisiond and every unmigrated daemon still bind a flat socket
# directly in here and rely on the setgid bit for the proxy's group.
#
# NOTE: `caddy` is Caddy's group on the production VPS (confirmed 2026-06-05).
# If you deploy elsewhere, confirm the reverse-proxy's group and adjust it here.
#
# Install:  sudo cp engine/scripts/tmpfiles.d/mrcalld.conf /etc/tmpfiles.d/
#           sudo systemd-tmpfiles --create /etc/tmpfiles.d/mrcalld.conf
d /run/mrcalld 2751 mrcalld caddy -
